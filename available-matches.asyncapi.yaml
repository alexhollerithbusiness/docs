asyncapi: 3.0.0
info:
  title: Kairos Available Matches
  version: 1.0.0
  description: |-
    A stream of the matches Kairos is currently pricing bets on. The complete set is sent when the stream opens, then each change on its own.

    Generated from the `com.jacktime.strykr` .proto files by `generate_asyncapi.py`; edit the .proto files or the script rather than this file.
defaultContentType: application/json
servers:
  production:
    host: api.example.com
    protocol: wss
    description: 'TODO: replace the placeholder host with the real Kairos WebSocket endpoint.'
channels:
  availableMatches:
    address: /matches/available
    title: Available matches
    description: 'Sent by Kairos: a snapshot first, then single changes and removals.'
    tags:
    - name: Matches
    messages:
      availableMatches:
        $ref: '#/components/messages/AvailableMatches'
      availableMatch:
        $ref: '#/components/messages/AvailableMatch'
      availableMatchRemoved:
        $ref: '#/components/messages/AvailableMatchRemoved'
operations:
  sendAvailableMatches:
    action: send
    summary: Messages Kairos sends on available matches.
    channel:
      $ref: '#/channels/availableMatches'
    messages:
    - $ref: '#/channels/availableMatches/messages/availableMatches'
    - $ref: '#/channels/availableMatches/messages/availableMatch'
    - $ref: '#/channels/availableMatches/messages/availableMatchRemoved'
components:
  messages:
    AvailableMatches:
      name: AvailableMatches
      title: Snapshot
      summary: The complete set of available matches, sent when the stream opens.
      payload:
        type: object
        description: |-
          The complete set of available matches, sent when a stream opens. Each change after that is sent on its own, as one match or as the id of a match that was removed.

          A match is available exactly when it is in this set, so no field states whether a match is available.
        properties:
          matches:
            type: array
            description: Every match Kairos is currently pricing bets on, in no particular order.
            items:
              type: object
              properties:
                match_id:
                  type: object
                  description: The external id clients and widgets identify the match by, which is also what its dictionary
                    entry is under.
                  properties:
                    id:
                      type: string
                score:
                  type: object
                  description: The current score of the match.
                  properties:
                    home:
                      type: integer
                      description: Omitted when it is 0.
                      format: uint32
                      minimum: 0
                      default: 0
                    away:
                      type: integer
                      description: Omitted when it is 0.
                      format: uint32
                      minimum: 0
                      default: 0
                offering_end_time:
                  type: object
                  description: The wall-clock moment at which Kairos stops offering the match. The offer safety buffer is
                    already subtracted from it, so nothing reading it subtracts anything further.
                  properties:
                    epoch_millis:
                      type: string
                      description: A 64-bit integer, written as a decimal string.
                      format: uint64
                      pattern: ^[0-9]+$
      examples:
      - name: Snapshot
        payload:
          matches:
          - match_id:
              id: match-123
            score:
              home: 1
              away: 0
            offering_end_time:
              epoch_millis: '1791201600000'
    AvailableMatch:
      name: AvailableMatch
      title: Match added or changed
      summary: One match that became available or changed.
      payload:
        type: object
        description: A match Kairos is currently pricing bets on. It carries what changes while the match is played, and the
          two sides it is displayed under are in the dictionary entry under the same id.
        properties:
          match_id:
            type: object
            description: The external id clients and widgets identify the match by, which is also what its dictionary entry
              is under.
            properties:
              id:
                type: string
          score:
            type: object
            description: The current score of the match.
            properties:
              home:
                type: integer
                description: Omitted when it is 0.
                format: uint32
                minimum: 0
                default: 0
              away:
                type: integer
                description: Omitted when it is 0.
                format: uint32
                minimum: 0
                default: 0
          offering_end_time:
            type: object
            description: The wall-clock moment at which Kairos stops offering the match. The offer safety buffer is already
              subtracted from it, so nothing reading it subtracts anything further.
            properties:
              epoch_millis:
                type: string
                description: A 64-bit integer, written as a decimal string.
                format: uint64
                pattern: ^[0-9]+$
      examples:
      - name: Changed
        payload:
          match_id:
            id: match-123
          score:
            home: 1
            away: 0
          offering_end_time:
            epoch_millis: '1791201600000'
    AvailableMatchRemoved:
      name: AvailableMatchRemoved
      title: Match removed
      summary: 'The id of a match that is no longer available. TODO: the .proto files define no envelope that tells this apart
        from the other messages on the stream.'
      payload:
        type: object
        properties:
          id:
            type: string
      examples:
      - name: Removed
        payload:
          id: match-123
